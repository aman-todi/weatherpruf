[project]
name = "wardrobe-backend"
version = "0.1.0"
description = "FastAPI backend serving the wardrobe REST API and the MCP connector Claude.ai talks to."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = [
    # Spec §0 says "FastMCP (v3)"; v4 is the current major and what this is
    # built against. The mounted-ASGI-sub-app pattern is unchanged between them.
    "fastmcp>=4.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The database pools are opened once for the whole session, so fixtures and
# tests have to share one event loop — asyncpg connections are bound to the
# loop that created them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
