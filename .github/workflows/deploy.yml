# Build the backend image, push it to ECR, and deploy it as an ECS Express Mode
# service (spec §7 Ticket 5).
#
# Express Mode provisions the Fargate service, load balancer, TLS certificate,
# auto-scaling and the public URL itself, so there is no task definition or
# service YAML to maintain here — the deploy action passes configuration
# directly and ECS creates the rest. See infra/README.md for the one-time
# setup (ECR repository, the two IAM roles, and the Secrets Manager entries).

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: weatherpruf-backend
  SERVICE_NAME: weatherpruf-backend

permissions:
  contents: read
  # This managed-IAM project cannot host a GitHub OIDC identity provider
  # (iam:*Provider* is SCP-denied at every plan level), so the deploy
  # authenticates with a scoped IAM user's access keys that can only assume
  # the deploy role. See infra/README.md.

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migrations to the test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database wardrobe_dev'
          psql -h localhost -U postgres -d wardrobe_dev -v ON_ERROR_STOP=1 \
            -f db/local/00_auth_shim.sql
          for f in db/migrations/*.sql; do
            psql -h localhost -U postgres -d wardrobe_dev -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres \
            -c "alter role wardrobe_readonly with password 'readonly-ci'"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and lint the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install and test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wardrobe_dev
          READONLY_DATABASE_URL: postgresql://wardrobe_readonly:readonly-ci@localhost:5432/wardrobe_dev
        run: |
          pip install -e '.[dev,mcp]'
          ruff check app tests
          ruff format --check app tests
          pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          # Vite inlines VITE_* at build time, so the Supabase project is baked
          # into the bundle here rather than supplied to the running task. Both
          # values are publishable — the anon key is safe in a bundle because
          # RLS protects the data — so they are repository variables, not
          # secrets. The service-role key is never passed to this build.
          docker build -f infra/Dockerfile -t "$IMAGE" \
            --build-arg VITE_SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy the ECS Express Mode service
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.SERVICE_NAME }}
          image: ${{ steps.image.outputs.uri }}
          execution-role-arn: ${{ secrets.AWS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.AWS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 8000
          health-check-path: /health
          cpu: "512"
          memory: "1024"
          min-task-count: 1
          # Pinned to a single task for v1: the MCP OAuth proxy keeps a
          # per-instance store of upstream tokens, so a second task would not
          # recognise tokens minted by the first. Move to a shared/persistent
          # store before raising this. See infra/README.md.
          max-task-count: 1
          # Non-sensitive configuration only. Anything secret goes through
          # `secrets` below so it never appears in the task definition, the
          # console, or these logs.
          environment-variables: |
            [
              {"name": "ENVIRONMENT", "value": "production"},
              {"name": "PUBLIC_BASE_URL", "value": "${{ vars.PUBLIC_BASE_URL }}"},
              {"name": "SUPABASE_URL", "value": "${{ vars.SUPABASE_URL }}"},
              {"name": "SUPABASE_OAUTH_CLIENT_ID", "value": "${{ vars.SUPABASE_OAUTH_CLIENT_ID }}"},
              {"name": "DAILY_MCP_CALL_LIMIT", "value": "${{ vars.DAILY_MCP_CALL_LIMIT }}"}
            ]
          # Each entry is a single JSON key inside the one Secrets Manager
          # secret described in infra/README.md. DATABASE_URL and
          # READONLY_DATABASE_URL are deliberately separate values: the
          # read-only role is the security backstop behind query_closet_items
          # and must never share credentials with the application role.
          secrets: |
            [
              {"name": "DATABASE_URL", "valueFrom": "${{ secrets.AWS_APP_SECRET_ARN }}:DATABASE_URL::"},
              {"name": "READONLY_DATABASE_URL", "valueFrom": "${{ secrets.AWS_APP_SECRET_ARN }}:READONLY_DATABASE_URL::"},
              {"name": "SUPABASE_SERVICE_ROLE_KEY", "valueFrom": "${{ secrets.AWS_APP_SECRET_ARN }}:SUPABASE_SERVICE_ROLE_KEY::"},
              {"name": "SUPABASE_JWT_SECRET", "valueFrom": "${{ secrets.AWS_APP_SECRET_ARN }}:SUPABASE_JWT_SECRET::"},
              {"name": "MCP_OAUTH_JWT_SIGNING_KEY", "valueFrom": "${{ secrets.AWS_APP_SECRET_ARN }}:MCP_OAUTH_JWT_SIGNING_KEY::"}
            ]
